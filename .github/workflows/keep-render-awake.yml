# Keep the free-tier Render API from sleeping (idle spin-down ~15m).
# Cold starts can exceed 60s and time out the Vercel proxy / browser.
name: Keep Render awake

on:
  schedule:
    # Every 12 minutes — within Render free idle window.
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake joblens-crm-api
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "https://joblens-crm-api.onrender.com/health" | grep -q healthy; then
              echo "healthy"
              exit 0
            fi
            echo "attempt $i failed; retrying..."
            sleep 5
          done
          echo "wake failed (non-fatal)"
          exit 0
